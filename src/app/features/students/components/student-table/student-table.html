<table>
    <thead>
        <tr>
            <th>Mã SV</th>
            <th>Họ tên</th>
            <th>Email</th>
            <th>Số điện thoại</th>
            <th>Lớp</th>
            <th>Khoa</th>
            <th>Hành động</th>
        </tr>
    </thead>

    <tbody>
        @for (student of students(); track student.id) {
            <tr>
                <td>{{ student.id }}</td>
                <td>{{ student.name }}</td>
                <td>{{ student.email }}</td>
                <td>{{ student.phone }}</td>
                <td>{{ student.className || '—' }}</td>
                <td>{{ student.faculty || '—' }}</td>
                <td>
                    <button type="button" (click)="edit.emit(student)">Sửa</button>

                    <button type="button" (click)="delete.emit(student.id)">Xoá</button>
                </td> 
            </tr>
        } @empty {
            <tr>
                <td colspan="7">Không có sinh viên nào phù hợp.</td>
            </tr>
        }
    </tbody>
</table>
