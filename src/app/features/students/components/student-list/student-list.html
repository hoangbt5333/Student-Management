
<h1>Quản lý sinh viên</h1>

<app-student-form
  [student]="selectedStudent()"
  (save)="saveStudent($event)"
  (cancel)="cancelEdit()"
/>

@if (facade.errorMessage()) {
  <p class="error-message">{{ facade.errorMessage() }}</p>
}

@if (facade.successMessage()) {
  <p class="success-message">{{ facade.successMessage() }}</p>
}

<div class="search-box">
  <input
    type="text"
    placeholder="Tìm theo mã sinh viên hoặc họ tên..."
    [value]="facade.searchTerm()"
    (input)="facade.setSearchTerm($any($event.target).value)"
  />
</div>

<p>Tổng số sinh viên: {{ studentCount() }}</p>

@if (facade.loading()) {
  <p>Đang tải danh sách...</p>
} @else {
  <app-student-table
    [students]="filteredStudents()"
    (edit)="editStudent($event)"
    (delete)="deleteStudent($event)"
  />
}
