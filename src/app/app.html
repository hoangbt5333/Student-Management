<header class="app-header">
  <h1>Student Management System</h1>

  <nav>
    <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
    <a routerLink="/students" routerLinkActive="active">Sinh viên</a>
    <a routerLink="/classes" routerLinkActive="active">Lớp học</a>
    <a routerLink="/teachers" routerLinkActive="active">Giảng viên</a>
    <a routerLink="/subjects" routerLinkActive="active">Môn học</a>
    <a routerLink="/grades" routerLinkActive="active">Điểm số</a>
  </nav>
</header>

<main class="app-content">
  @if (loading()) {
    <div class="global-loading" role="status">
        <span class="spinner"></span>
        <span>Đang xử lý...</span>
    </div>
  }

  @if (notification.errorMessage(); as message) {
    <div class="error-banner" role="alert">
      <span>{{ message }}</span>
      <button
        type="button"
        (click)="notification.clearError()"
        aria-label="Đóng thông báo">
        Đóng
      </button>
    </div>
  }  
               
  <router-outlet />
</main>
